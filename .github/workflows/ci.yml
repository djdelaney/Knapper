name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # AGENTS.md and CLAUDE.md are two real byte-identical files (a symlink
      # would be tidier, but agent tooling in use here refuses to read one).
      # Checked against the INDEX: identical content means git stored ONE blob
      # under both paths, so comparing object ids is exact and needs no diff.
      # Runs first because it costs nothing and fails fast.
      - name: AGENTS.md and CLAUDE.md have not drifted
        run: |
          mode=$(git ls-files -s AGENTS.md | awk '{print $1}')
          if [ "$mode" = "120000" ]; then
            echo "::error file=AGENTS.md::AGENTS.md is a symlink. It must be a real file —" \
                 "agent tooling used here refuses symlinked instructions and then runs with" \
                 "no guidance at all. Fix: rm AGENTS.md && cp CLAUDE.md AGENTS.md"
            exit 1
          fi
          if [ "$(git rev-parse :AGENTS.md)" != "$(git rev-parse :CLAUDE.md)" ]; then
            echo "::error file=AGENTS.md::AGENTS.md and CLAUDE.md have drifted." \
                 "Edit CLAUDE.md, then mirror it: cp CLAUDE.md AGENTS.md"
            git --no-pager diff --no-index -- CLAUDE.md AGENTS.md || true
            exit 1
          fi

      # The runbook is the one deliverable no test executes, and six review
      # rounds found defects a careful read had missed — a fact corrected in
      # one of the two places it lived, a reference to a section that did not
      # exist. These checks are the mechanical subset of that review.
      - name: Lint the deployment runbook
        run: ops/runbook-lint.sh

      # ops/*.sh is out of reach of the .NET suite, and sync-heartbeat.sh gates
      # every mutation — its original check was vacuous for the whole of v0.1.x
      # and only deployment caught it. Runs on linux, which is where the real
      # gate runs; the tier SKIPS on a macOS dev box (no GNU date -d).
      - name: Shell tests
        run: tests/shell/run.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The query layer shells out to a real ripgrep, so the suite is not
      # self-contained without one — and the VERSION is part of the contract.
      # rg 14 reports "searches": 0 in its JSON summary for a query with no
      # matches, which empties scannedFiles: the evidence that "no match" means
      # "the scope was exhaustively searched" rather than "nothing was looked
      # at". rg 15 counts them correctly. apt still ships 14.x, so pin the
      # release binary and test the configuration the code actually assumes.
      - name: Install ripgrep (pinned)
        run: |
          RG_VERSION=15.2.0
          RG_DIR="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          curl -sSLf -o /tmp/rg.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_DIR}.tar.gz"
          tar xzf /tmp/rg.tar.gz -C /tmp
          sudo install "/tmp/${RG_DIR}/rg" /usr/local/bin/rg
          rg --version

      - name: Build
        run: dotnet build Knapper.slnx --configuration Release

      # Includes the black-box acceptance tier: real server processes over
      # real HTTP, plus the cross-process flock probes.
      - name: Test
        run: dotnet test Knapper.slnx --configuration Release --no-build
